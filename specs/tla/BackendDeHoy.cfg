\* `backend/` TAL COMO ESTA HOY (rama `examen-cierre`), y el diseno de PLAN-23
\* tal como esta aprobado. Mismo modelo pequeno que `HarnessBackend.cfg`; solo
\* cambian los interruptores, que aqui valen lo que hace el codigo.
\*
\* NO pasa, y ese es su proposito: cada invariante que TLC rompe aqui es un
\* hallazgo con su traza (CE-6..CE-13 en README.md). Se ejecuta con `-continue`
\* para que TLC no se pare en la primera violacion y las enseñe todas; la
\* salida literal esta en `tlc-backend-de-hoy.txt`. La vivacidad se comprueba
\* aparte (`BackendDeHoyVivacidad.cfg`), porque `-continue` no la admite.
\*
\*   java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC -workers auto -continue -config BackendDeHoy.cfg HarnessBackend.tla

