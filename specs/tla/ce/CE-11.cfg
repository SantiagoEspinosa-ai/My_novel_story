\* CE-11 . F-113: la puerta publica un capitulo que el Editor no juzgo.
\* Las constantes de `BackendDeHoy.cfg` y una sola invariante, para que TLC
\* devuelva la traza mas corta que la rompe. Salida en `tlc-ce-11.txt`.
\*
\*   java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC -workers auto -config ce/CE-11.cfg HarnessBackend.tla

SPECIFICATION Spec

CONSTANTS
    NumCapitulos = 5
    ReescriturasDelEditor = 2
    ReescriturasPorVetada = 1
    ReintentosDeTransporte = 1
    RevisionesDePlan = 2
    ReintentosDePublicacion = 1
    TopeDelegaciones = 8
    MaxCaidas = 1
    MaxRegeneraciones = 1
    ReanudarReiniciaContadores = TRUE
    DosTransaccionesAlConsolidar = TRUE
    PuertaAceptaSinVeredicto = TRUE
    TopePorCapitulo = TRUE
    ReanudarSaltaLaMemoria = TRUE
    VigenteEsLaUltimaCreada = TRUE
    RondasDePuertaPorObra = TRUE
    ConservarVersionAlRegenerar = TRUE

INVARIANTS
    NuncaPublicaSinValidar
