\* El backend CORREGIDO: los cinco interruptores de `backend/` con la
\* correccion de F-110..F-114 y F-116, y los dos de PLAN-23 con la propuesta de
\* CE-14 y CE-15. Es la ejecucion que tiene que pasar. Salida literal en
\* `tlc-backend-corregido.txt`.
\*
\* Modelo pequeno del enunciado: 5 capitulos y 2 reintentos de calidad
\* (`reescrituras_del_editor`, 3 intentos). Los demas topes valen 1 -o 2 el de
\* revisiones del plan, para que haya un rechazo antes de aprobar-, que es lo
\* minimo que recorre cada rama del contador y su agotamiento. `MaxCaidas` y
\* `MaxRegeneraciones` valen 1: son lo unico que puede repetirse sin fin.
\* `TopeDelegaciones = 8` deja publicar una novela limpia (5 ciclos) y agota el
\* presupuesto en una con muchos reintentos.
\*
\*   java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC -workers auto -config HarnessBackend.cfg HarnessBackend.tla

SPECIFICATION Spec

CONSTANTS
    NumCapitulos = 5
    ReescriturasDelEditor = 2
    ReescriturasPorVetada = 1
    ReintentosDeTransporte = 1
    RevisionesDePlan = 2
    ReintentosDePublicacion = 1
    TopeDelegaciones = 8
    MaxCaidas = 1
    MaxRegeneraciones = 1
    ReanudarReiniciaContadores = FALSE
    DosTransaccionesAlConsolidar = FALSE
    PuertaAceptaSinVeredicto = FALSE
    TopePorCapitulo = FALSE
    ReanudarSaltaLaMemoria = FALSE
    VigenteEsLaUltimaCreada = FALSE
    RondasDePuertaPorObra = FALSE
    ConservarVersionAlRegenerar = TRUE

INVARIANTS
    TypeOK
    NuncaPublicaSinValidar
    NuncaPierdeCapitulos
    NoReescribeCerrados
    NoSaltaCapitulos
    SoloSobreConsolidadas
    MemoriaCompleta
    ReintentosAcotados
    RondasDePlanConservadas
    DelegacionesAcotadas
    CadaVersionTieneSuTope
    LectorVeLoPublicado

PROPERTIES
    VersionesSoloCrecen
    Terminacion
