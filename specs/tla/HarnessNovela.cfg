\* Configuracion 2 de 2: EL SISTEMA CORREGIDO.
\*
\* Los tres interruptores llevan el valor que exigen el enunciado y
\* `docs/architecture.md`. Esta es la ejecucion que pasa: 12.343 estados
\* generados, 6.066 distintos, profundidad 29, sin errores.
\*
\* Modelo pequeno segun el enunciado: 5 capitulos y 2 intentos por capitulo.
\* `MaxCaidas` y `MaxRegeneraciones` valen 1 porque son lo unico que puede
\* repetirse sin fin: sin cota el modelo es infinito y TLC no termina. Con 1
\* ya se recorre el camino completo caida -> reanudacion -> publicacion y el
\* camino publicacion -> cambio del lector -> republicacion, que es lo que
\* hay que verificar.
\*
\*   java -cp tla2tools.jar tlc2.TLC -config HarnessNovela.cfg HarnessNovela.tla

SPECIFICATION Spec

CONSTANTS
    NumCapitulos = 5
    MaxIntentos = 2
    MaxCaidas = 1
    MaxRegeneraciones = 1
    ExigirValidacionCompleta = TRUE
    PublicarAlAgotarTope = FALSE
    ReanudarPorCursor = FALSE
    ConservarVersionAlRegenerar = TRUE

INVARIANTS
    TypeOK
    NuncaPublicaSinValidar
    NuncaPierdeCapitulos
    NoReescribeCerrados
    NoSaltaCapitulos
    ReintentosAcotados

PROPERTIES
    VersionesSoloCrecen
    Terminacion
