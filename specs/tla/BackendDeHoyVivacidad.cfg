\* `backend/` de hoy, lo que SI cumple: las invariantes que no rompe y las dos
\* propiedades temporales, entre ellas la vivacidad (`Terminacion`). Mismas
\* constantes que `BackendDeHoy.cfg` salvo dos, y las dos se dicen aqui porque
\* cambian lo que esta ejecucion demuestra:
\*
\* `TopeDelegaciones` vale 1 y no 8: con `TopePorCapitulo = TRUE` el tope no
\* cambia ninguna transicion (compara siempre 0, F-114), y el contador fantasma
\* `ciclos`, que satura en Tope+1, solo multiplicaba estados identicos.
\*
\* `NumCapitulos` vale 3 y no 5. Con 5, el codigo de hoy no tiene el tope de
\* delegaciones que poda el modelo corregido, y TLC paso de 37 millones de
\* estados distintos en 37 minutos sin terminar; la salida interrumpida esta en
\* `tlc-backend-de-hoy-vivacidad-5-capitulos-interrumpida.txt`. Con 3 se recorren
\* las mismas acciones -primer capitulo, capitulos intermedios, ultimo, puerta y
\* regeneracion desde cualquier capitulo-, pero **no es el modelo de 5**: la
\* vivacidad del codigo de hoy esta comprobada en 3 capitulos, y en 5 solo la
\* del corregido (`tlc-backend-corregido.txt`). Salida en
\* `tlc-backend-de-hoy-vivacidad.txt`.
\*
\*   java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC -workers auto -config BackendDeHoyVivacidad.cfg HarnessBackend.tla

SPECIFICATION Spec

CONSTANTS
    NumCapitulos = 3
    ReescriturasDelEditor = 2
    ReescriturasPorVetada = 1
    ReintentosDeTransporte = 1
    RevisionesDePlan = 2
    ReintentosDePublicacion = 1
    TopeDelegaciones = 1
    MaxCaidas = 1
    MaxRegeneraciones = 1
    ReanudarReiniciaContadores = TRUE
    DosTransaccionesAlConsolidar = TRUE
    PuertaAceptaSinVeredicto = TRUE
    TopePorCapitulo = TRUE
    ReanudarSaltaLaMemoria = TRUE
    VigenteEsLaUltimaCreada = TRUE
    RondasDePuertaPorObra = TRUE
    ConservarVersionAlRegenerar = TRUE

INVARIANTS
    TypeOK
    NuncaPierdeCapitulos
    NoSaltaCapitulos

PROPERTIES
    VersionesSoloCrecen
    Terminacion
