; Configuracion de pytest.
;
; Existe por un motivo concreto: `archivo/` guarda el codigo de la arquitectura
; anterior, y con el sus dos archivos de test. Ese codigo ya no se puede
; importar (ver archivo/NOTA.md), asi que si pytest los recogiera, `python -m
; pytest` fallaria por ImportError sin que nada este roto de verdad.
;
; `testpaths` dice donde buscar cuando se lanza pytest sin argumentos, y
; `norecursedirs` evita que un `pytest <ruta>` explicito acabe entrando ahi.

[pytest]
testpaths = tests
norecursedirs = archivo .venv venv .git __pycache__ salida
